"$schema": http://json-schema.org/draft-04/schema#
"$id": https://nix.dev/manual/nix/latest/protocols/json/schema/file-system-object-v1.json
title: File System Object
description: |
  This schema describes the JSON representation of Nix's [File System Object](@docroot@/store/file-system-object.md).

  The schema is recursive because file system objects contain other file system objects.
type: object
required: ["type"]
properties:
  type:
    type: string
    enum: ["regular", "symlink", "directory"]

# Enforce conditional structure based on `type`
anyOf:
  - $ref: "#/$defs/regular"
    required:
      - "type"
      - "format"
      - "contents"

  - $ref: "#/$defs/directory"
    required:
      - "type"
      - "format"
      - "entries"

  - $ref: "#/$defs/symlink"
    required:
      - "type"
      - "format"
      - "target"

  - $ref: "#/$defs/symlink"
    required: ["type", "target"]

"$defs":
  regular:
    title: Regular File
    description: |
      See [Regular File](@docroot@/store/file-system-object.md#regular) in the manual for details.
    required:
      - "contents"
      - "format"
    properties:
      type:
        const: "regular"
      contents:
        type: string
        description: File contents, encoded according to `format`.
      executable:
        type: boolean
        description: Whether the file is executable.
        default: false
      format:
        enum:
          - "base64"
          - "raw"
        description: |
          Whether `target` is encoded with base64 or as it.

          `raw` can only be used if the string is valid unicode.
    additionalProperties: false

  directory:
    title: Directory
    description: |
      See [Directory](@docroot@/store/file-system-object.md#directory) in the manual for details.
    required:
      - "entries"
      - "format"
    properties:
      type:
        const: "directory"
      entries:
        type: object
        description: |
          Map of names to nested file system objects (for type=directory)

          Names are encoded according to `format`.
        additionalProperties:
          $ref: "#"
      format:
        enum:
          - "base64"
          - "raw"
        description: |
          Whether the keys of `contents` are encoded with base64 or as it.

          `raw` can only be used if the string is valid unicode.
    additionalProperties: false

  symlink:
    title: Symbolic Link
    description: |
      See [Symbolic Link](@docroot@/store/file-system-object.md#symlink) in the manual for details.
    required:
      - "target"
      - "format"
    properties:
      type:
        const: "symlink"
      target:
        type: string
        description: Target path of the symlink, encoded according to `format`.
      format:
        enum:
          - "base64"
          - "raw"
        description: |
          Whether `target` is encoded with base64 or as it.

          `raw` can only be used if the string is valid unicode.
    additionalProperties: false
